<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Warmer Eyes</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #status { position: absolute; left: 10px; bottom: 10px; color: #fff; font: 13px -apple-system, system-ui, sans-serif; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 8px; }
    #start { position: absolute; inset: 0; margin: auto; width: 240px; height: 72px; font: 600 20px -apple-system, system-ui, sans-serif; border-radius: 16px; border: 0; background: #ff9a3c; color: #14110f; display: none; }
  </style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div id="status">Starting camera…</div>
  <button id="start">Start camera</button>
  <script type="module" src="/src/eyes/main.ts"></script>
</body>
</html>
